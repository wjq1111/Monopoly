<body>
<div class="studio">
<header class="studio-head"><div><div class="eyebrow">OUR HOME / INTERFACE STUDY</div><h1>我们的家 · 界面布局</h1></div><span class="badge">v001 · 布局提案 · 非联网游戏</span></header>
<div class="studio-controls"><label for="viewer">当前玩家（布局演示）</label><select id="viewer"><option value="0">三花</option><option value="1">布偶</option><option value="2">奶牛</option></select><span class="proto-note">切换三名玩家，体验选角、准备与剧情共读的等待状态。</span></div>
<nav class="tabs" role="tablist" aria-label="查看各界面布局"></nav>
<div class="preview" id="preview"><main class="stage" id="stage" role="tabpanel" aria-label="界面布局稿"></main></div>
<div class="inspector"><section><h2 id="screenTitle"></h2><p id="layoutNote"></p></section><section><h2>后续素材与交互边界</h2><p id="assetNote"></p></section></div>
<p class="overview-note">1600 × 900 构图草案；现有 Godot 工程仍为 1100 × 760 本地脚手架。猫图仅作已有候选参考；连线、骰点、库存和多人状态不构成规则实现。原棋盘格位保留，移动方向与岔路处理待定。</p>
</div>
<script>
"use strict";
const cats=[
{name:"三花",role:"大哥",img:"../art/candidates/sanhua_portrait_v001.png"},
{name:"布偶",role:"二哥",img:"../art/references/user_cat_02.png"},
{name:"奶牛",role:"小弟",img:"../art/references/user_cat_01.png"}
];
const boardData=[
[1,7,1,"烂尾楼"],[2,7,2,"草丛"],[3,7,3,"土路"],[4,7,4,"游乐场"],[5,6,4,"公园钓鱼点"],[6,5,4,"池塘入水口"],[7,4,4,"白沙池"],[8,4,5,"邪恶鹅大哥"],[9,4,6,"公园草丛"],[10,7,5,"10路公交站"],[11,7,6,"广场"],[12,7,7,"下水道"],[13,6,7,"健身房"],[14,5,7,"餐馆"],[15,4,7,"幸福小区"],[16,3,7,"16路公交站"],[17,2,7,"墓地"],[18,1,7,"废品处理厂"],[19,1,6,"小溪"],[20,1,5,"宠物医院"],[21,1,4,"公告栏"],[22,1,3,"海莉"],[23,1,2,"23路公交站"],[24,1,1,"公园入口"],[25,2,1,"流浪猫聚集地"],[26,3,1,"丧彪"],[27,4,1,"树林"],[28,5,1,"养殖场"],[29,6,1,"草丛"]
];
const views=[
["entry","01 联机入口","先进入同一局，再各自选角。创建与加入集中在一处，角色和背景留出完整展示面积。","主背景一张、游戏标题、三猫组合参考。地址输入只占一个对话框；具体连接服务形式尚未确定。"],
["room","02 房间 / 选角","上方是三名玩家连接状态；中间是三只猫；底部显示选择顺序与准备状态。卡片确认角色后保留同伴所选信息。","三张同规格角色图、统一角色卡、准备/等待/已占用状态。示例三人已连接，准备流程为交互提案。"],
["board","03 大富翁棋盘","左侧持续显示三猫状态；中央按原图放置29格；右侧显示选中地块与当前动作；月份置顶，仓库等入口置底。","棋盘底图与可交互地块分层。地块名称、编号、棋子和动态文字保留为引擎元素。点击地块仅查看布局，不移动棋子。"],
["story","04 三人共读剧情","四格按左上→右上→左下→右下阅读。各格文字独立排版；底部常驻三人阅读状态，全部看完后共同返回流程。","本页用原稿6.png中离开烂尾楼、到公园避雨的连续情节拆分示意，尚非最终对白。四格画面分别生成；看完确认及分页同步协议仍为待确认提案。"],
["battle","05 战斗","延续左侧三猫状态；中央是敌人与战斗场地、闪避位置；右侧是当前猫的骰子、技能、召集或逃跑操作。","战斗场景底图、敌方形象与动作反馈。鹅的150为春季原稿数值；此页只定空间，敌方轮次和闪避时点尚待策划裁定。"],
["warehouse","06 小猫仓库","下旬补给集中在物品网格和三猫状态之间；物品详情、目标与消耗提示留在右侧，避免遮住库存。","复用物品卡与详情面板。库存数字只占位；物资归属、由谁操作和结束补给条件待定，不在布局中固化。"],
["growth","07 角色 / 成长","左侧是角色、等级和饱食度；右侧显示各级能力与二选一。觉醒作为已有角色成长的剧情入口。","复用角色图、技能卡与选项态。展示三花已确认的技能摘要；布局本身不授予技能，也不决定能否改选。"],
["rescue","08 濒死 / 送医","用当前状态、可行动同伴和医院目标解释救援。实际移动仍在棋盘上完成；送医结果复用共同观看和结果提示。","状态图标、同伴选择卡、医院插图。挂靠对象的具体选择方式待定；医院免费救治、恢复2来自原稿。"],
["ending","09 结局","用全屏画面与文字结束这一段共同经历，复用三人共读状态。结局后的操作只在玩法明确后加入。","结局插图沿用救助站原稿与已定角色基准；不提前添加重打、继续月份或新结局。"]
];
let screen="board",selectedTile=9,chosen=[null,null,null],selectionOrder=[],ready=[false,false,false],read=[false,false,false],viewer=0,overlay="",returnScreen="board";
const stage=document.getElementById("stage"),tabs=document.querySelector(".tabs");
function art(label,extra="",num=""){return '<div class="art"><strong>'+label+'</strong>'+(extra?'<small>'+extra+'</small>':"")+(num?'<span class="letter">'+num+'</span>':"")+'</div>';}
function btn(label,action,kind="",disabled=false){return '<button type="button" class="'+kind+'" data-action="'+action+'"'+(disabled?' disabled':"")+'>'+label+'</button>';}
function topBar(title="",right=""){return '<header class="topbar"><span class="brand">我们的家</span>'+(title?'<span>'+title+'</span>':"")+'<div class="flex">'+right+'</div></header>';}
function img(c,cls="avatar"){return '<img class="'+cls+'" src="'+c.img+'" alt="'+c.name+'已有肖像候选">';}
function players(){return '<aside class="column">'+cats.map((c,i)=>'<div class="player-mini '+(i===0?"current":"")+'">'+img(c)+'<div><strong>'+c.name+'</strong><br><small>'+(i===0?"当前行动":"等待同伴")+'</small></div><div class="stats">等级 1　野性 0/10<br>饱食度 <span class="pips">●●●○○</span></div></div>').join("")+'<div class="logline muted">同一局 · 三名玩家</div></aside>';}
function readers(){return '<div class="readers">'+cats.map((c,i)=>'<div class="reader '+(read[i]?"done":"")+'">'+img(c)+'<span>'+c.name+' · '+(read[i]?"已看完":"阅读中")+'</span></div>').join("")+'</div>';}
function show(name){screen=name;overlay="";render();}
function entry(){return '<section class="screen">'+topBar("",'<span class="pill">三名玩家 · 系统主持</span>')+'<div class="intro"><div><span class="section-title">三只猫的故事</span><h2>我们的家</h2><p class="subtitle">从三兄弟的第一步开始。</p><p class="muted">和同伴进入同一局，一起走过每一段故事。</p><div class="actions">'+btn("创建一局","create","main")+btn("加入同伴","join")+'</div></div><div class="portrait-stack">'+cats.map(c=>img(c,"")).join("")+'</div></div><footer class="footer"><small class="muted">准备好后，在房间里选择你的猫。</small>'+btn("设置","settings","flat")+'</footer></section>';}
function room(){let all=chosen.every(n=>n!==null),have=chosen.includes(viewer),done=all&&ready.every(Boolean);return '<section class="screen">'+topBar("房间与选角",'<span class="pill"><i class="dot"></i> 同一局 · 3/3</span>'+btn("离开房间","entry","flat"))+'<div class="seats">'+cats.map((c,i)=>'<div class="seat"><span>玩家 '+(i+1)+(i===viewer?" · 你":"")+'</span><small>'+ (ready[i]?"已准备":"已连接 · 等待准备")+'</small></div>').join("")+'</div><div class="characters">'+cats.map((c,i)=>'<article class="character">'+img(c,"portrait")+'<div class="body"><div class="flex"><h3>'+c.name+'</h3><span class="tag">'+c.role+'</span></div><div class="numbers"><span>等级 1</span><span>野性 0/10</span><span>饱食度 3/5</span></div><span class="ready-state">'+(chosen[i]!==null?"玩家 "+(chosen[i]+1)+" · 已确认角色":"等待玩家选择")+'</span>'+btn(chosen[i]!==null?"角色已确认":"选择"+c.name,"choose:"+i,chosen[i]!==null?"soft":"main",chosen[i]!==null||have)+'</div></article>').join("")+'</div><footer class="footer"><div><strong>选择顺序：'+(selectionOrder.length?selectionOrder.map(i=>cats[i].name).join(" → "):"等待选择")+'</strong><br><small class="muted">当前已有 '+ready.filter(Boolean).length+'/3 玩家准备。</small></div><div class="flex">'+btn(ready[viewer]?"你已准备":"我准备好了","ready","soft",!have||ready[viewer])+btn(done?"进入棋盘":"等待三人准备","board","main",!done)+'</div></footer></section>';}
function board(){let d=boardData.find(t=>t[0]===selectedTile);return '<section class="screen">'+topBar("第 1 年 · 3 月 · 上旬",'<span class="pill">春 · 新月基础消耗 1</span>'+btn("设置","settings","flat"))+'<div class="game-layout">'+players()+'<div class="board-wrap"><div class="board"><div class="board-center"><h3>三只猫的小天地</h3><span>城镇与公园 · 棋盘底图位置</span></div><div class="board-land">环境插画<br>预留区域</div>'+boardData.map(t=>'<button class="tile '+(t[0]===selectedTile?"selected":"")+'" data-action="tile:'+t[0]+'" style="grid-row:'+t[1]+';grid-column:'+t[2]+'" aria-label="'+t[0]+'号 '+t[3]+'"><em>'+t[0]+'</em><span>'+t[3]+'</span>'+(t[0]===1?'<span class="tokens">三 布 奶</span>':"")+'</button>').join("")+'</div></div><aside class="panel event-detail"><div><div class="section-title">正在查看的地块</div><h3>'+d[0]+' · '+d[3]+'</h3></div>'+art("地点插图")+'<p>'+(d[0]===9?"加菲叔叔的线索，将把故事带向下一处。":"地块说明、可选操作和结果提示放在这里。")+'</p><div class="actionbox"><small class="muted">轮到三花行动</small>'+btn("掷骰子","event","main")+btn("查看剧情布局","story","soft")+'</div></aside></div><footer class="footer"><small>上旬 → 中旬 → 下旬补给 → 新月</small><nav class="bottom-menu">'+btn("小猫仓库","warehouse")+btn("我的猫","growth")+btn("行动记录","log")+'</nav></footer></section>';}
function story(){let frames=[["回到烂尾楼","失去妈妈后，三兄弟决定回去。那里还留着妈妈的气味。"],["被赶出家","拿着施工图纸的人出现了。三只猫被施工人员赶走。"],["寻找庇护","天色转暗，即将下雨。三只猫必须寻找新的庇护所。"],["相互依偎","三只猫钻进森林公园，找到避雨的地方，相互依偎度过一夜。"]];return '<section class="screen">'+topBar("寻找新的落脚处",'<span class="pill">共同剧情 · 三人观看</span>')+'<div class="comic-grid">'+frames.map((f,i)=>'<article class="comic">'+art(f[0],"分镜画面预留",String(i+1))+'<div class="caption"><b>0'+(i+1)+' / 原稿摘要</b><p>'+f[1]+'</p></div></article>').join("")+'</div><footer class="read-footer">'+readers()+'<div class="story-actions"><span class="muted" aria-live="polite">'+read.filter(Boolean).length+'/3 已看完</span>'+btn(read[viewer]?"你已看完 · 等待同伴":"我看完了","read","main",read[viewer])+btn("一起继续","continue","soft",!read.every(Boolean))+'</div></footer></section>';}
function battle(){return '<section class="screen">'+topBar("与鹅大哥相遇",'<span class="pill">同伴共同观看</span>'+btn("回棋盘布局","board","flat"))+'<div class="battle">'+players()+'<div class="arena"><div class="enemy"><h3 style="margin:0">邪恶鹅大哥</h3><span>饱食度 150 / 150</span></div>'+art("战斗场地与敌方形象","保留猫的站位、动作和受击空间")+'<div class="dodge">'+[1,2,3].map(n=>btn("位置 "+n,"position:"+n)).join("")+'</div></div><aside class="panel column"><div class="section-title">当前猫 · 三花</div><div class="bigdice">⚄</div><p>战斗骰点 × 当前等级</p>'+btn("掷战斗骰","battlehint","main")+btn("技能","growth")+btn("呼唤同伴","support")+btn("逃跑 · 饱食度 −1","escape")+'<small class="muted">同伴的状态持续显示在左侧。</small></aside></div></section>';}
function warehouse(){let items=["猫草","猫罐头","猫条","鸡胸肉","毛毯","猫薄荷","废纸壳","鲢鳙"];return '<section class="screen">'+topBar("下旬 · 小猫仓库",btn("回棋盘","board","flat"))+'<div class="inventory-layout"><div class="items">'+items.map((n,i)=>'<article class="item">'+art(n+"图标")+'<h3>'+n+'</h3><span class="count">库存数量　—</span>'+btn("查看","item:"+i,"soft")+'</article>').join("")+'</div><aside class="panel column"><div class="section-title">三只猫的状态</div>'+cats.map(c=>'<div class="flex">'+img(c)+'<div>'+c.name+'<br><small>饱食度 3/5</small></div></div>').join("")+'<div class="rule"></div><p>物品用途、使用对象与消耗确认显示在这里。</p><div class="notice">进入新月前，先照顾好每只猫。</div></aside></div><footer class="footer"><small class="muted">共享小猫仓库</small><span class="pill">补给阶段</span></footer></section>';}
function growth(){return '<section class="screen">'+topBar("三花 · 角色与成长",btn("回棋盘","board","flat"))+'<div class="cat-growth"><aside class="panel column">'+img(cats[0],"portrait-large")+'<h3>三花 · 大哥</h3><p>等级 1　野性 0/10</p><p>饱食度 3/5</p><div class="notice">达到4级后，下一个自己的行动用于觉醒。</div></aside><div class="column"><h3>每一次成长，都有新的本领</h3><div class="growth-steps"><article class="growth"><small>2 级 · 二选一 · 未解锁</small><h3>游泳 / 捕猎</h3><p>游泳精通<br>捕猎精通</p></article><article class="growth"><small>3 级 · 未解锁</small><h3>撤回</h3><p>每次行动<br>可重投一次</p></article><article class="growth"><small>4 级 · 二选一 · 未解锁</small><h3>再来一次</h3><p>或<br>大哥的觉悟</p></article><article class="growth"><small>5 级 · 觉醒后 · 未解锁</small><h3>第四种颜色</h3><p>战斗闪避位<br>相关能力</p></article></div><div class="panel"><h3>技能详情与选择</h3><p>这里显示当前可选技能、原稿效果与选择确认。</p><p class="muted">等级与觉醒条件未达到时，保留可阅读的锁定状态。</p></div></div></div></section>';}
function rescue(){return '<section class="screen">'+topBar("同伴需要帮助",'<span class="pill">濒死 · 挂靠送医</span>'+btn("回棋盘","board","flat"))+'<div class="rescue-layout">'+art("同伴与医院的叙事插图","不替代棋盘上的实际送医移动")+'<div class="column"><div class="panel"><h3>三花进入濒死</h3><p>仍有可以行动的同伴。由同伴携带，前往20号宠物医院。</p></div><div class="panel"><h3>可行动的同伴</h3><div class="chooser">'+btn("布偶","carrier:1")+btn("奶牛","carrier:2")+'</div></div><div class="panel sage"><h3>20号 · 宠物医院</h3><p>免费救治，解除对应状态，恢复2饱食度。</p><p>到达医院并完成救治后，结束送医挂靠。</p></div></div></div><footer class="footer"><span class="muted">全员濒死走全体复活流程。</span>'+btn("查看医院位置","hospital","main")+'</footer></section>';}
function ending(){return '<section class="screen ending"><span class="section-title">三只猫 · 同一段故事</span><h2>我们的家</h2>'+art("救助站结局插图","按原稿成功剧情制作")+'<p>结局文字与分镜沿用原稿。</p>'+readers()+'<small class="muted">结局后继续方式尚未确定，本稿保留呈现空间。</small></section>';}
function dialog(){if(!overlay)return "";let title="",body="",actions="";if(overlay==="join"){title="加入同伴";body='<p>输入同伴的房间地址。</p><label for="roomAddress">房间地址</label><input id="roomAddress" placeholder="房间地址" autocomplete="off">';actions=btn("取消","close")+btn("查看房间布局","room","main");}else if(overlay==="settings"){title="设置";body='<div class="column"><label>音乐音量 <input aria-label="音乐音量" type="range" min="0" max="100" value="60"></label><label>音效音量 <input aria-label="音效音量" type="range" min="0" max="100" value="70"></label></div>';actions=btn("返回","close","main");}else if(overlay==="event"){title="地块事件与操作";body='<p>事件画面与文字由三名玩家共同观看。</p><p>需要操作时，在这里显示当前猫可选的动作。</p>';actions=btn("返回","close")+btn("查看漫画剧情","story","main");}else if(overlay==="log"){title="行动记录";body='<p>三名玩家已进入同一局。</p><p>三只猫的初始状态已建立。</p>';actions=btn("返回棋盘","close","main");}else{title="操作与反馈的位置";body='<p>此处预留选项、确认、等待同伴或结果反馈。</p>';actions=btn("返回布局","close","main");}return '<div class="overlay-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-label="'+title+'"><h3>'+title+'</h3>'+body+'<div class="actions">'+actions+'</div></section></div>';}
function render(){const cfg=views.find(v=>v[0]===screen);tabs.innerHTML=views.map(v=>'<button type="button" role="tab" id="tab-'+v[0]+'" aria-controls="stage" aria-selected="'+(v[0]===screen)+'" data-screen="'+v[0]+'">'+v[1]+'</button>').join("");stage.setAttribute("aria-labelledby","tab-"+screen);stage.innerHTML=({entry,room,board,story,battle,warehouse,growth,rescue,ending}[screen])()+dialog();document.getElementById("screenTitle").textContent=cfg[1]+" · 信息布局";document.getElementById("layoutNote").textContent=cfg[2];document.getElementById("assetNote").textContent=cfg[3];if(overlay){stage.querySelector(".dialog button")?.focus();}}
tabs.addEventListener("click",e=>{const b=e.target.closest("[data-screen]");if(b)show(b.dataset.screen);});
stage.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b||b.disabled)return;const a=b.dataset.action;if(views.some(v=>v[0]===a)){if(a==="story"){returnScreen=screen==="entry"?"board":screen;read=[false,false,false];}show(a);return;}if(a==="create"){chosen=[null,null,null];selectionOrder=[];ready=[false,false,false];show("room");return;}if(a.startsWith("choose:")){let c=Number(a.split(":")[1]);if(chosen[c]===null&&!chosen.includes(viewer)){chosen[c]=viewer;selectionOrder.push(c);}}else if(a.startsWith("tile:")){selectedTile=Number(a.split(":")[1]);}else if(a==="hospital"){selectedTile=20;show("board");return;}else if(a==="ready"){if(chosen.includes(viewer))ready[viewer]=true;}else if(a==="read"){read[viewer]=true;}else if(a==="continue"&&read.every(Boolean)){show(returnScreen);return;}else if(a==="close"){overlay="";}else{overlay=["join","settings","event","log"].includes(a)?a:"placeholder";}render();});
document.getElementById("viewer").addEventListener("change",e=>{viewer=Number(e.target.value);render();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay){overlay="";render();}});
new ResizeObserver(()=>{const w=document.getElementById("preview").clientWidth;stage.style.transform="scale("+w/1600+")";document.getElementById("preview").style.height=(900*w/1600)+"px";}).observe(document.getElementById("preview"));
render();
</script>
</body>
</html>
